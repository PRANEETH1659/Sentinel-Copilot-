# SentinelCopilot - local, free infrastructure
# Everything here runs on YOUR machine. No cloud account, no billing.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: sentinel-es
    # Comes back on its own whenever Docker Desktop starts, so you don't
    # have to remember `docker compose up -d` after every reboot.
    restart: unless-stopped
    environment:
      # Single-node = no clustering needed for a demo project
      - discovery.type=single-node
      # Security is OFF purely for local-dev simplicity. Never do this in production.
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No volume on purpose - this is a cache (app/cache_ph3.py), not a
    # datastore. Losing it on a container restart just means the next
    # question re-runs the full search+LLM path instead of hitting cache.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
volumes:
  es_data:

# NOTE: Ollama is NOT in this file on purpose. On Windows, Ollama runs as a
# native background service (installed separately) so it can use your GPU
# properly. It's reachable at http://localhost:11434 from our Python code.
#
# Qdrant and Redpanda (our Kafka stand-in) will be added to this file in
# later phases, once we're actually using them - no point running
# containers we don't need yet.
