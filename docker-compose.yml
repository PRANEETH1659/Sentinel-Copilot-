# SentinelCopilot - local, free infrastructure
# Everything here runs on YOUR machine. No cloud account, no billing.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: sentinel-es
    # Comes back on its own whenever Docker Desktop starts, so you don't
    # have to remember `docker compose up -d` after every reboot.
    restart: unless-stopped
    environment:
      # Single-node = no clustering needed for a demo project
      - discovery.type=single-node
      # Security is OFF purely for local-dev simplicity. Never do this in production.
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No volume on purpose - this is a cache (app/cache_ph3.py), not a
    # datastore. Losing it on a container restart just means the next
    # question re-runs the full search+LLM path instead of hitting cache.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Phase 5d: creates both topics once Redpanda is healthy, then exits.
  # Fixes the old gap where `rpk topic create` had to be re-run by hand
  # after the Redpanda container was recreated. "|| true" = topic already
  # exists is fine.
  redpanda-init:
    image: redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create security-alerts -X brokers=redpanda:29092 || true;
        rpk topic create audit-events -X brokers=redpanda:29092 || true
    restart: "no"

  # ---------------------------------------------------------------------
  # Phase 5d: the app itself, containerised. These only start with
  #     docker compose --profile app up -d --build
  # so plain `docker compose up -d` still starts ONLY the infrastructure,
  # exactly as before, and you can keep running uvicorn from your venv.
  # Inside Docker, services find each other by service name
  # (elasticsearch, redis, redpanda:29092), not localhost.
  # ---------------------------------------------------------------------
  api:
    build: .
    image: sentinelcopilot:latest
    container_name: sentinel-api
    profiles: ["app"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: &app-env
      ES_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      # Docker Desktop (Windows/Mac) already knows host.docker.internal;
      # this line makes it work on Linux (e.g. CI) too.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on: &app-deps
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  alert-consumer:
    build: .                       # same Dockerfile; layers are cached, so this is instant
    image: sentinelcopilot:latest
    container_name: sentinel-alert-consumer
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.consumer_ph4"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-deps

  audit-consumer:
    build: .                       # same Dockerfile; layers are cached, so this is instant
    image: sentinelcopilot:latest
    container_name: sentinel-audit-consumer
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.audit_consumer_ph5"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on: *app-deps

volumes:
  es_data:

# NOTE: Ollama is NOT in this file on purpose. On Windows, Ollama runs as a
# native background service (installed separately) so it can use your GPU
# properly. It's reachable at http://localhost:11434 from our Python code.
#
# Qdrant was considered for Phase 3b's semantic cache and again for Phase
# 4's live-alerts index, but both ended up reusing Elasticsearch instead
# (see PROGRESS.md's Phase 3b design-decision note) - so it's no longer
# planned. Redpanda (our Kafka stand-in, above) is already running.
